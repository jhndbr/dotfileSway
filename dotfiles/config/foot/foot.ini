# Foot terminal configuration - Fluent Purple & Laptop Optimized

font=JetBrains Mono:size=10, Symbols Nerd Font:size=10
pad=10x10
term=foot

[tweak]
font-monospace-warn=no

[cursor]
style=block
color=101010 ba68c8
blink=no

[mouse]
hide-when-typing=yes

[colors]
alpha=0.88
background=101010
foreground=e6e6e6

## Normal colors
regular0=1a1a1a  # black
regular1=e57373  # red
regular2=81c784  # green
regular3=ffb74d  # yellow
regular4=64b5f6  # blue
regular5=ba68c8  # purple (accent)
regular6=4dd0e1  # cyan
regular7=e6e6e6  # white

## Bright colors
bright0=555555   # bright black
bright1=ef9a9a   # bright red
bright2=a5d6a7   # bright green
bright3=ffe082   # bright yellow
bright4=90caf9   # bright blue
bright5=ce93d8   # bright purple
bright6=80deea   # bright cyan
bright7=ffffff   # bright white

selection-foreground=121212
selection-background=ba68c8
