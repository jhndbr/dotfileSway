# Variables de entorno para la sesión Wayland (systemd user session)
XDG_CURRENT_DESKTOP=sway:GNOME
XDG_SESSION_DESKTOP=sway
XDG_SESSION_TYPE=wayland

# Qt Theme & Dark Mode Integration (Qt5 & Qt6)
QT_QPA_PLATFORM="wayland;xcb"
QT_QPA_PLATFORMTHEME="gtk3"
QT_STYLE_OVERRIDE="kvantum"
QT_PLUGIN_PATH="/home/jhon/.local/usr/lib/x86_64-linux-gnu/qt6/plugins"
LD_LIBRARY_PATH="/home/jhon/.local/usr/lib/x86_64-linux-gnu"
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_AUTO_SCREEN_SCALE_FACTOR=1

# Integración con navegadores y motores gráficos
MOZ_ENABLE_WAYLAND=1
GDK_BACKEND="wayland,x11,*"
ELECTRON_OZONE_PLATFORM_HINT=auto
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland

# Preferencia de tema oscuro y cursores unificados
GTK_THEME="Fluent-purple-Dark"
XCURSOR_THEME="Adwaita"
XCURSOR_SIZE=24

# Compatibilidad con aplicaciones Java (evita ventanas grises)
_JAVA_AWT_WM_NONREPARENTING=1
