# ====================================================================
# Foot Terminal Configuration - SwayShell Theme
# ====================================================================

term=xterm-256color
font=JetBrains Mono:size=11, Inter:size=11
font-bold=JetBrains Mono:weight=bold:size=11
font-italic=JetBrains Mono:slant=italic:size=11
dpi-aware=yes
pad=16x16

[cursor]
style=beam
color=1e1e2e cba6f7
blink=yes
beam-thickness=1.5

[colors]
alpha=0.92
foreground=cdd6f4
background=1e1e2e

## Normal/regular colors (Catppuccin Mocha)
regular0=45475a  # surface1
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # pink
regular6=94e2d5  # teal
regular7=bac2de  # subtext1

## Bright colors
bright0=585b70   # surface2
bright1=f38ba8   # red
bright2=a6e3a1   # green
bright3=f9e2af   # yellow
bright4=89b4fa   # blue
bright5=f5c2e7   # pink
bright6=94e2d5   # teal
bright7=a6adc8   # subtext0

## Selection & Highlight
selection-foreground=cdd6f4
selection-background=45475a
urls=cba6f7

[scrollback]
lines=10000
multiplier=3.0

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
