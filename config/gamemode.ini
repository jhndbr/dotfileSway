; ╔══════════════════════════════════════════════════════════════╗
; ║          Feral GameMode Configuration                       ║
; ║          Optimización de CPU, I/O y Silencio de Notificaciones ║
; ╚══════════════════════════════════════════════════════════════╝

[general]
; Gobernador de frecuencia CPU durante el juego
desiredgov=performance
defaultgov=ondemand

; Prioridad de proceso (renice negativo = mayor prioridad para el juego)
renice=-10

; Prioridad de I/O en disco (0 = máxima prioridad clase real-time/best effort)
ioprio=0

; Inhibir protector de pantalla y suspensión durante el juego
inhibit_screensaver=1

; Programación en tiempo real suave (SCHED_ISO / SCHED_RR si el kernel lo soporta)
softrealtime=auto

[custom]
; Comandos al iniciar el juego: Silenciar Dunst y notificar estado
start=notify-send -u low -a "GameMode" "🎮 GameMode Activado" "Perfil de rendimiento activo (CPU Performance & Sin interrupciones)" 2>/dev/null; command -v dunstctl &>/dev/null && dunstctl set-paused true

; Comandos al cerrar el juego: Restaurar notificaciones
end=notify-send -u low -a "GameMode" "🎮 GameMode Desactivado" "Restaurado gobernador estándar y notificaciones" 2>/dev/null; command -v dunstctl &>/dev/null && dunstctl set-paused false
