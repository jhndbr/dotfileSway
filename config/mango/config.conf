# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Configuration                    ║
# ║                    macOS Monochromatic Style                ║
# ║       Port 1:1 de config/sway/config (rama pc-note)         ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Validar sintaxis sin arrancar:  mango -c ~/.config/mango/config.conf -p
# Recargar en caliente:           Super+Shift+C  (o: mmsg dispatch reload_config)

# ── Entorno ──────────────────────────────────────────────────────
source=./env.conf

# ════════════════════════════════════════════════════════════════
#  APARIENCIA — Bordes, gaps y colores (equivalente a Sway)
# ════════════════════════════════════════════════════════════════

# Bordes limpios y gaps simétricos estilo macOS
borderpx=2
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0
no_border_when_single=0

# Colores fallback (sobrescritos por Matugen en ./dank-colors)
rootcolor=0x141414ff
bordercolor=0x2c2c2eff
focuscolor=0xffffffff
urgentcolor=0xff453aff
maximizescreencolor=0x1c1c1eff
scratchpadcolor=0x8e8e93ff
globalcolor=0xffffffff
overlaycolor=0x1c1c1eff
dropcolor=0xffffff33
splitcolor=0xff453aff

# Paleta dinámica de Matugen (opcional: si no existe, quedan los fallbacks)
source-optional=./dank-colors

# ════════════════════════════════════════════════════════════════
#  EFECTOS — Modern Sleek: Esquinas 12px, Dimming sutil y Sombras Profundas
# ════════════════════════════════════════════════════════════════

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Dimming sutil de ventanas inactivas (0% GPU overhead, foco visual premium)
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000028

# Sin Blur — Rendimiento puro para gaming (0 lag, 0 consumo GPU innecesario)
blur=0
blur_layer=0
blur_optimized=1

# Sombras suaves con elevación flotante (solo ventanas flotantes y modales)
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=16
shadows_blur=22
shadows_position_x=0
shadows_position_y=4
shadowscolor=0x00000055

# Animaciones Spring / Elastic Fluido (Snappy, 160-190ms con curva elástica sutil)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.88
zoom_end_ratio=0.88
fadein_begin_opacity=0.75
fadeout_begin_opacity=0.85
animation_duration_move=190
animation_duration_open=170
animation_duration_tag=190
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.16,1.0,0.3,1
animation_curve_close=0.16,1.0,0.3,1
animation_curve_focus=0.16,1.0,0.3,1
animation_curve_opafadeout=0.16,1.0,0.3,1
animation_curve_opafadein=0.16,1.0,0.3,1

# ════════════════════════════════════════════════════════════════
#  LAYOUTS
# ════════════════════════════════════════════════════════════════

# Dwindle (layout por defecto, lo más parecido al tiling de Sway)
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1

# Master-stack (tile)
new_is_master=0
default_mfact=0.55
default_nmaster=1

# Scroller
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Ciclo de Super+D (equivale a "layout toggle split")
circle_layout=dwindle,tile,scroller

# Overview (Exposé / Mission Control nativo)
enable_hotarea=0
overviewgappi=8
overviewgappo=24
jump_labels=HJKLASDFGQWERTYUIOPZXCVBNM

# ════════════════════════════════════════════════════════════════
#  COMPORTAMIENTO
# ════════════════════════════════════════════════════════════════

# focus_follows_mouse yes
sloppyfocus=1
warpcursor=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
# Inhibir reposo / protector de pantalla en pantalla completa (gaming y multimedia)
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=1
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
# Throttling de refresco al arrastrar/redimensionar (evita picos de CPU y micro-stutter)
drag_tile_refresh_interval=8.0
drag_floating_refresh_interval=8.0
cursor_size=24
xwayland_persistence=1
syncobj_enable=1
axis_bind_apply_timeout=100
single_scratchpad=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Gaming Tearing: 2 = Solo pantalla completa (0 latencia de buffer en juegos, 0 tearing en escritorio)
allow_tearing=2

# ════════════════════════════════════════════════════════════════
#  TECLADO (layout en inputs.conf, generado por keyboard-layout.sh)
# ════════════════════════════════════════════════════════════════

repeat_rate=50
repeat_delay=300
numlockon=1
source-optional=./inputs.conf

# Mouse
mouse_natural_scrolling=0

# ════════════════════════════════════════════════════════════════
#  SUB-CONFIGS
# ════════════════════════════════════════════════════════════════

source=./tag.conf
source=./bind.conf
source=./rule.conf
source-optional=./monitor.conf
# Perfil PC / Laptop (setup.sh copia device.conf.pc o device.conf.laptop)
source-optional=./device.conf

# ════════════════════════════════════════════════════════════════
#  AUTOSTART
# ════════════════════════════════════════════════════════════════

exec-once=bash ~/.config/mango/autostart.sh
