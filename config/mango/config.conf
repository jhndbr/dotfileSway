# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Configuration                       ║
# ║                    macOS Monochromatic Style                   ║
# ║                    Modern · Elegant · Smooth Animations        ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Dynamic Palette from Matugen (sobreescribe los fallbacks) ──────
source=./dank-colors

# ════════════════════════════════════════════════════════════════
#  EFFECTS — Glassmorphism, Blur & Shadows
# ════════════════════════════════════════════════════════════════

# Blur (frosted glass)
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.90
blur_params_contrast=0.90
blur_params_saturation=1.15

# Shadows
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=16
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x00000066

# Window appearance
border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.88

# ════════════════════════════════════════════════════════════════
#  ANIMATIONS — Smooth, Fluid, macOS-like
# ════════════════════════════════════════════════════════════════

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.40
zoom_end_ratio=0.70
fadein_begin_opacity=0.80
fadeout_begin_opacity=0.80

# Durations (ms)
animation_duration_move=420
animation_duration_open=380
animation_duration_tag=320
animation_duration_close=600
animation_duration_focus=320

# Curves — custom cubic-bezier for fluid motion
animation_curve_open=0.46,1.0,0.29,1.05
animation_curve_move=0.46,1.0,0.29,1.0
animation_curve_tag=0.46,1.0,0.29,1.0
animation_curve_close=0.08,0.92,0,1.0
animation_curve_focus=0.46,1.0,0.29,1.0
animation_curve_opafadeout=0.58,0.98,0.58,0.98
animation_curve_opafadein=0.46,1.0,0.29,1.0

# ════════════════════════════════════════════════════════════════
#  SCROLLER LAYOUT
# ════════════════════════════════════════════════════════════════

scroller_structs=20
scroller_default_proportion=0.80
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# ════════════════════════════════════════════════════════════════
#  MASTER-STACK LAYOUT
# ════════════════════════════════════════════════════════════════

new_is_master=1
smartgaps=0
default_mfact=0.55
default_nmaster=1

# ════════════════════════════════════════════════════════════════
#  DWINDLE LAYOUT
# ════════════════════════════════════════════════════════════════

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1

# ════════════════════════════════════════════════════════════════
#  OVERVIEW
# ════════════════════════════════════════════════════════════════

hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# ════════════════════════════════════════════════════════════════
#  MISC
# ════════════════════════════════════════════════════════════════

xwayland_persistence=1
syncobj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad=1

# ════════════════════════════════════════════════════════════════
#  KEYBOARD
# ════════════════════════════════════════════════════════════════

repeat_rate=50
repeat_delay=300
numlockon=1

# Keyboard layout (sobrescrito por keyboard-layout.sh → inputs.conf)
source=./inputs.conf

# ════════════════════════════════════════════════════════════════
#  TRACKPAD
# ════════════════════════════════════════════════════════════════

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0

# ════════════════════════════════════════════════════════════════
#  APPEARANCE — Gaps & Borders
# ════════════════════════════════════════════════════════════════

gappih=8
gappiv=8
gappoh=4
gappov=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

# Colors (fallback — sobrescritos por dank-colors de Matugen)
rootcolor=0x141414ff
bordercolor=0x2c2c2eff
focuscolor=0xffffffff
dropcolor=0x8FBA7C55
splitcolor=0xEB441Eff
maximizescreencolor=0xBABD2Cff
urgentcolor=0xff453aff
scratchpadcolor=0xc4939dff
globalcolor=0x8d64cfff
overlaycolor=0x95C381ff

# ════════════════════════════════════════════════════════════════
#  SUB-CONFIG LOAD
# ════════════════════════════════════════════════════════════════

source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf
source=./device.conf

# ════════════════════════════════════════════════════════════════
#  AUTOSTART
# ════════════════════════════════════════════════════════════════

exec-once=~/.config/mango/autostart.sh
