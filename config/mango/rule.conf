# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Window Rules                        ║
# ║                    Float · Center · Animate                     ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Diálogos y ventanas flotantes del sistema ────────────────────
windowrule=isfloating:1,appid:polkit-gnome-authentication-agent-1
windowrule=isfloating:1,appid:pavucontrol
windowrule=width:750,height:550,appid:pavucontrol
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:org.gnome.Calculator
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk
windowrule=isfloating:1,appid:xfce-polkit

# ── Terminal flotante (Yazi) ─────────────────────────────────────
windowrule=isfloating:1,width:1050,height:680,title:yazi
windowrule=animation_type_open:zoom,title:yazi
windowrule=animation_type_close:zoom,title:yazi

# ── Visor de imágenes (imv) ──────────────────────────────────────
windowrule=isfloating:1,appid:imv
windowrule=animation_type_open:zoom,appid:imv
windowrule=animation_type_close:zoom,appid:imv

# ── Lector PDF (zathura) ─────────────────────────────────────────
windowrule=isfloating:1,width:900,height:700,appid:org.pwmt.zathura

# ── Reproductor MPV ──────────────────────────────────────────────
windowrule=isfloating:1,width:960,height:540,appid:mpv
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:mpv

# ── Wofi (launcher) ──────────────────────────────────────────────
windowrule=isfloating:1,appid:wofi
windowrule=isnoborder:1,appid:wofi
windowrule=animation_type_open:zoom,appid:wofi
windowrule=animation_type_close:zoom,appid:wofi

# ── Firefox ──────────────────────────────────────────────────────
windowrule=force_fakemaximize:1,appid:firefox
windowrule=isfloating:1,title:Picture-in-Picture
windowrule=isfloating:1,title:Firefox — Sharing Indicator

# ── Diálogos de archivos (Open/Save) ────────────────────────────
windowrule=isfloating:1,title:Open File
windowrule=isfloating:1,title:Save File
windowrule=isfloating:1,title:Open Folder
windowrule=isfloating:1,title:Save As
windowrule=width:800,height:600,title:Open File
windowrule=width:800,height:600,title:Save File
windowrule=animation_type_open:zoom,title:Open File
windowrule=animation_type_open:zoom,title:Save File

# ── Pantalla completa en flameshot ───────────────────────────────
windowrule=noswallow:1,appid:flameshot
windowrule=isfullscreen:1,appid:flameshot
windowrule=animation_type_open:none,appid:flameshot
windowrule=animation_type_close:none,appid:flameshot

# ── Event Tester (debug) ────────────────────────────────────────
windowrule=noswallow:1,title:Event Tester

# ── Opacidad completa para apps que no deben atenuarse ───────────
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:foot
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:firefox
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:Google-chrome

# ── Reglas de capas (Layer Rules) ────────────────────────────────
layerrule=noblur:1,noanim:1,layer_name:selection
layerrule=noshadow:1,layer_name:swaync-control-center
layerrule=noshadow:1,layer_name:swaync-notification-window
layerrule=noblur:1,noanim:1,layer_name:dimland_layer
layerrule=animation_type_open:zoom,layer_name:launcher
layerrule=animation_type_close:zoom,layer_name:launcher
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:zoom,layer_name:wofi
layerrule=animation_type_close:zoom,layer_name:wofi
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:hyprpicker
layerrule=noanim:1,layer_name:showkeys
layerrule=animation_type_open:fade,layer_name:swaync-control-center
layerrule=animation_type_close:fade,layer_name:swaync-control-center
layerrule=animation_type_open:fade,layer_name:swayosd
layerrule=animation_type_close:fade,layer_name:swayosd
