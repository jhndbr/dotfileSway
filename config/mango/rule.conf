# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Window Rules                      ║
# ║                    Float · Dimensiones · Centrado            ║
# ║       Port 1:1 de reglas for_window de Sway (pc-note)        ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Diálogos y utilidades del sistema ───────────────────────────
windowrule=isfloating:1,appid:polkit-gnome-authentication-agent-1
windowrule=isfloating:1,appid:xfce-polkit
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

windowrule=isfloating:1,width:750,height:550,appid:pavucontrol
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:org.gnome.Calculator

# ── Thunar (diálogos y progreso) ────────────────────────────────
windowrule=isfloating:1,appid:thunar,title:.*progreso.*
windowrule=isfloating:1,appid:thunar,title:.*progress.*
windowrule=isfloating:1,appid:Thunar,title:.*progreso.*
windowrule=isfloating:1,appid:Thunar,title:.*progress.*

# ── Visores Multimedia & Documentos ─────────────────────────────
windowrule=isfloating:1,appid:imv
windowrule=isfloating:1,width:900,height:700,appid:org.pwmt.zathura
windowrule=isfloating:1,width:960,height:540,appid:mpv

# ── Ventanas flotantes para aplicaciones CLI / TUI ───────────────
windowrule=isfloating:1,width:1250,height:820,appid:cli-newsboat
windowrule=isfloating:1,width:1100,height:750,appid:cli-nchat
windowrule=isfloating:1,width:1100,height:720,appid:cli-btop
windowrule=isfloating:1,width:1200,height:800,appid:cli-lazygit
windowrule=isfloating:1,width:850,height:480,appid:cli-cava
windowrule=isfloating:1,width:1050,height:700,appid:cli-ncdu
windowrule=isfloating:1,width:550,height:320,appid:cli-clock
windowrule=isfloating:1,width:920,height:680,appid:cli-fastfetch
windowrule=isfloating:1,width:950,height:620,appid:cli-matrix

# ── Lanzador Wofi ───────────────────────────────────────────────
windowrule=isfloating:1,isnoborder:1,isnoshadow:1,appid:wofi

# ── Diálogos de Archivos comunes (Open / Save / etc) ────────────
windowrule=isfloating:1,width:800,height:600,title:.*Open.*
windowrule=isfloating:1,width:800,height:600,title:.*Save.*
windowrule=isfloating:1,width:800,height:600,title:.*Abrir.*
windowrule=isfloating:1,width:800,height:600,title:.*Guardar.*

# ── Picture-in-Picture & Indicadores Web ────────────────────────
windowrule=isfloating:1,isglobal:1,width:480,height:270,title:Picture-in-Picture
windowrule=isfloating:1,title:Firefox — Sharing Indicator

# ── Gaming & Alto Rendimiento (0 overhead, Tearing y Prevenir Reposo) ───
# Steam: Ventanas secundarias flotantes
windowrule=isfloating:1,appid:steam,title:.*Friends List.*
windowrule=isfloating:1,appid:steam,title:.*Steam - News.*
windowrule=isfloating:1,appid:steam,title:.*Settings.*
windowrule=isfloating:1,appid:steam,title:.*Properties.*

# Juegos nativos y vía Proton / Steam: forzar tearing de baja latencia y desactivar efectos
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:steam_app_.*
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:gamescope
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:cs2
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,title:Counter-Strike 2
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:heroic
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:lutris
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:retroarch
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:pcsx2.*
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:.*wine.*
windowrule=force_tearing:1,isnoanimation:1,isnoshadow:1,noblur:1,idleinhibit_when_focus:1,appid:.*proton.*

# ── Reglas de Capas (Layer Rules) ───────────────────────────────
# slurp selection: sin blur ni animaciones, blindada contra captura (evita artefactos y lag)
layerrule=noblur:1,noanim:1,shield_when_capture:1,layer_name:selection

# Lanzadores Wofi y Rofi: animación zoom fluida
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:wofi
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi

# OSD y Notificaciones: animaciones limpias y sin sombras redundantes
layerrule=animation_type_open:fade,animation_type_close:fade,layer_name:swayosd
layerrule=animation_type_open:slide,animation_type_close:slide,noshadow:1,layer_name:swaync
