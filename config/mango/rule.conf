# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Window Rules                      ║
# ║                    Float · Dimensiones · Centrado            ║
# ║       Port 1:1 de reglas for_window de Sway (pc-note)        ║
# ╚══════════════════════════════════════════════════════════════╝
# ── WebApps & Navegadores Brave / Chrome (Sin barra de ventana del sistema) ──
# allow_csd:1 permite el layout limpio nativo sin forzar barra de título de sistema.
# Regex para cubrir TODOS los webapps actuales y futuros generados por Brave/Chrome:
window_rule=allow_csd:1,app_id:brave-.*
window_rule=allow_csd:1,app_id:chrome-.*
window_rule=allow_csd:1,app_id:crx_.*
window_rule=allow_csd:1,app_id:brave-browser
window_rule=allow_csd:1,app_id:brave-origin


# ── Diálogos y utilidades del sistema ───────────────────────────
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1
window_rule=is_floating:1,app_id:xfce-polkit
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk

window_rule=is_floating:1,width:750,height:550,app_id:pavucontrol
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:org.gnome.Calculator

# ── Thunar (diálogos y progreso) ────────────────────────────────
window_rule=is_floating:1,app_id:thunar,title:.*progreso.*
window_rule=is_floating:1,app_id:thunar,title:.*progress.*
window_rule=is_floating:1,app_id:Thunar,title:.*progreso.*
window_rule=is_floating:1,app_id:Thunar,title:.*progress.*

# ── Visores Multimedia & Documentos ─────────────────────────────
window_rule=is_floating:1,app_id:imv
window_rule=is_floating:1,width:900,height:700,app_id:org.pwmt.zathura
window_rule=is_floating:1,width:960,height:540,app_id:mpv

# ── Ventanas flotantes para aplicaciones CLI / TUI ───────────────
window_rule=is_floating:1,width:1250,height:820,app_id:cli-newsboat
window_rule=is_floating:1,width:1100,height:750,app_id:cli-nchat
window_rule=is_floating:1,width:1100,height:720,app_id:cli-btop
window_rule=is_floating:1,width:1200,height:800,app_id:cli-lazygit
window_rule=is_floating:1,width:850,height:480,app_id:cli-cava
window_rule=is_floating:1,width:1050,height:700,app_id:cli-ncdu
window_rule=is_floating:1,width:550,height:320,app_id:cli-clock
window_rule=is_floating:1,width:920,height:680,app_id:cli-fastfetch
window_rule=is_floating:1,width:950,height:620,app_id:cli-matrix

# ── Lanzador Wofi (Sin blur de ventana ni de capa, transparencia limpia) ────
#window_rule=is_floating:1,no_render_border:1,no_shadow:1,no_blur:1,app_id:wofi

# ── Diálogos de Archivos comunes (Open / Save / etc) ────────────
window_rule=is_floating:1,width:800,height:600,title:.*Open.*
window_rule=is_floating:1,width:800,height:600,title:.*Save.*
window_rule=is_floating:1,width:800,height:600,title:.*Abrir.*
window_rule=is_floating:1,width:800,height:600,title:.*Guardar.*

# ── Picture-in-Picture & Indicadores Web ────────────────────────
window_rule=is_floating:1,is_global:1,width:480,height:270,title:Picture-in-Picture
window_rule=is_floating:1,title:Firefox — Sharing Indicator

# ── Gaming & Alto Rendimiento (0 overhead, Tearing y Prevenir Reposo) ───
# Steam: Ventanas secundarias flotantes
window_rule=is_floating:1,app_id:steam,title:.*Friends List.*
window_rule=is_floating:1,app_id:steam,title:.*Steam - News.*
window_rule=is_floating:1,app_id:steam,title:.*Settings.*
window_rule=is_floating:1,app_id:steam,title:.*Properties.*

# Juegos nativos y vía Proton / Steam: forzar tearing de baja latencia y desactivar efectos
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:steam_app_.*
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:gamescope
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:cs2
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,title:Counter-Strike 2
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:dota2
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:heroic
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:lutris
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:retroarch
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:pcsx2.*
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:.*wine.*
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,app_id:.*proton.*
window_rule=force_tearing:1,no_animation:1,no_shadow:1,no_blur:1,idle_inhibit_when_focus:1,title:.*(Steam App|Proton).*

# ── Transparencia & Frosted Glass Blur por Aplicación ───────────
# Apps Electron / Web con opacidad calibrada para proyectar el blur del compositor manteniendo texto 100% nítido
window_rule=focused_opacity:0.90,unfocused_opacity:0.84,app_id:.*[jJ]oplin.*
window_rule=focused_opacity:0.90,unfocused_opacity:0.84,title:.*Joplin.*
window_rule=focused_opacity:0.90,unfocused_opacity:0.84,app_id:.*[tT]hunderbird.*
window_rule=focused_opacity:0.92,unfocused_opacity:0.86,app_id:firefox.*
window_rule=focused_opacity:0.90,unfocused_opacity:0.84,app_id:code.*
window_rule=focused_opacity:0.90,unfocused_opacity:0.84,app_id:antigravity.*

# ── Aplicaciones Qt (Strawberry, qBittorrent, OBS, Dolphin, Qt5ct, Qt6ct, Telegram, etc.) ──
# Proyectan el blur Kawase del compositor manteniendo textos, iconos y controles 100% nítidos
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:.*strawberry.*
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,title:.*[sS]trawberry.*
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:.*qbittorrent.*
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,title:.*qBittorrent.*
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:.*[dD]olphin.*
window_rule=focused_opacity:0.90,unfocused_opacity:0.82,app_id:.*obs.*
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:qt5ct
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:qt6ct
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:pavucontrol-qt
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:org.telegram.desktop
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:telegramdesktop
window_rule=focused_opacity:0.88,unfocused_opacity:0.80,app_id:kvantummanager

# ── Aplicaciones GTK nativas (Thunar, Pavucontrol, etc.) ──
# Thunar con mayor profundidad de blur frosted glass (0.86 / 0.78)
window_rule=focused_opacity:0.86,unfocused_opacity:0.78,app_id:.*[tT]hunar.*
window_rule=focused_opacity:1.0,unfocused_opacity:0.92,app_id:pavucontrol
window_rule=focused_opacity:1.0,unfocused_opacity:0.92,app_id:blueman-manager
window_rule=focused_opacity:1.0,unfocused_opacity:0.92,app_id:nm-connection-editor
window_rule=focused_opacity:1.0,unfocused_opacity:0.92,app_id:org.gnome.Calculator

# Reproductores multimedia y visualizadores 100% opacos sin blur
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,no_blur:1,app_id:mpv
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,no_blur:1,app_id:imv

# ── Reglas de Capas (Layer Rules) ───────────────────────────────
# slurp selection: sin blur ni animaciones, blindada contra captura (evita artefactos y lag)
layer_rule=no_blur:1,no_animation:1,shield_when_capture:1,layer_name:selection

# Lanzadores Wofi y Rofi: animación zoom fluida, transparencia limpia SIN blur
layer_rule=no_blur:1,animation_type_open:zoom,animation_type_close:zoom,layer_name:wofi
layer_rule=no_blur:1,animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi

# OSD y Notificaciones: animaciones limpias y sin sombras redundantes
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:swayosd
layer_rule=animation_type_open:slide,animation_type_close:slide,no_shadow:1,layer_name:swaync
layer_rule=animation_type_open:slide,animation_type_close:slide,no_shadow:1,layer_name:notifications

