# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Keybindings                         ║
# ║                    macOS Monochromatic Style                   ║
# ╚══════════════════════════════════════════════════════════════╝
#
#  Mod principal: SUPER (Mod4 / Tecla Windows)
#  Diseñado para coincidir con los atajos de Sway anteriores.

# ── Reload / Quit ───────────────────────────────────────────────
bind=SUPER,Shift+C,spawn,bash ~/.config/mango/scripts/config_check.sh
bind=SUPER,Shift+C,reload_config
bind=SUPER,Shift+E,spawn,~/.local/bin/power-menu.sh
bind=SUPER,M,quit

# ── Terminal & Launcher ────────────────────────────────────────
bind=SUPER,Return,spawn,foot
bind=SUPER,A,spawn,wofi --show drun
bind=SUPER+SHIFT,Return,spawn,foot --title=yazi -e yazi
bind=SUPER,Y,spawn,foot --title=yazi -e yazi

# ── Cerrar ventana ──────────────────────────────────────────────
bind=SUPER,Q,killclient

# ── Bloquear pantalla ───────────────────────────────────────────
bind=SUPER,L,spawn,gtklock
bind=SUPER,Escape,spawn,gtklock

# ── Centro de Control / Quick Settings ──────────────────────────
bind=SUPER,X,spawn,~/.local/bin/quicksettings-menu.sh

# ── Gestor de monitores ─────────────────────────────────────────
bind=SUPER,P,spawn,~/.local/bin/monitor-manager.sh menu
bind=none,XF86Display,spawn,~/.local/bin/monitor-manager.sh menu

# ── Portapapeles (Cliphist) ─────────────────────────────────────
bind=SUPER,V,spawn,cliphist list | wofi --dmenu --prompt "Clipboard" | cliphist decode | wl-copy

# ── Selector de Emojis (Super + Punto) ──────────────────────────
bind=SUPER,period,spawn,~/.local/bin/emoji-picker.sh

# ── Distribución de teclado (Super + Shift + Espacio) ──────────
bind=SUPER+SHIFT,space,spawn,~/.local/bin/keyboard-layout.sh menu

# ── Capturas de pantalla ────────────────────────────────────────
# Pantalla completa
bind=none,Print,spawn,grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send "📸 Screenshot" "Pantalla completa guardada"
# Seleccionar área → guardar + copiar
bind=SUPER,Print,spawn,grim -g "$(slurp -d -b 1c1c1eaa -c ffffffff -s ffffff20 -w 1)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy && notify-send "📸 Screenshot" "Selección guardada y copiada"
# Seleccionar área → solo copiar
bind=SUPER+SHIFT,S,spawn,grim -g "$(slurp -d -b 1c1c1eaa -c ffffffff -s ffffff20 -w 1)" - | wl-copy && notify-send "📸 Screenshot" "Selección copiada al portapapeles"
# Menú de screenshot completo
bind=SUPER+SHIFT,Print,spawn,~/.local/bin/screenshot.sh
# Color picker
bind=SUPER+SHIFT,P,spawn,~/.local/bin/color-picker.sh

# ── Navegación de foco (Vim h/j/k + Flechas) ────────────────────
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up

# Nota: Mod+L está reservado para bloqueo → usar flecha derecha para foco derecho
bind=SUPER,Right,focusdir,right
bind=SUPER,Tab,focusstack,next
bind=SUPER,U,focuslast

# ── Mover ventanas (Vim h/j/k + Flechas) ────────────────────────
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Mover ventana flotante ──────────────────────────────────────
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# ── Redimensionar ventana ────────────────────────────────────────
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ── Estado de ventana ────────────────────────────────────────────
bind=SUPER,W,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER+SHIFT,F,togglefakefullscreen
bind=SUPER,Space,focusmodetoggle
bind=ALT,Tab,togglejump
bind=SUPER,G,toggleglobal
bind=SUPER,O,toggleoverlay
bind=SUPER,I,minimized
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,Z,toggle_scratchpad

# ── Scratchpad ──────────────────────────────────────────────────
bind=SUPER+SHIFT,Minus,move_scratchpad
bind=SUPER,Minus,show_scratchpad

# ── Layout ──────────────────────────────────────────────────────
bind=SUPER,B,dwindle_toggle_split_direction
bind=ALT,S,zoom

# Master-Stack
bind=SUPER,E,incnmaster,1
bind=SUPER,T,incnmaster,-1

# Switch layout (tile → scroller)
bind=SUPER,N,switch_layout
bind=CTRL+SUPER,I,setlayout,tile
bind=CTRL+SUPER,L,setlayout,scroller

# ── Tags (Workspaces) ───────────────────────────────────────────
# Switch to tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,9,0

# Move window to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Toggle tag visibility
bind=CTRL+SUPER,1,toggletag,1
bind=CTRL+SUPER,2,toggletag,2
bind=CTRL+SUPER,3,toggletag,3
bind=CTRL+SUPER,4,toggletag,4
bind=CTRL+SUPER,5,toggletag,5
bind=CTRL+SUPER,6,toggletag,6
bind=CTRL+SUPER,7,toggletag,7
bind=CTRL+SUPER,8,toggletag,8
bind=CTRL+SUPER,9,toggletag,9

# Navigate tags left/right
bind=SUPER,grave,toggleoverview,1
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# ── Monitor switch ──────────────────────────────────────────────
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=ALT+SHIFT,Up,focusmon,up
bind=ALT+SHIFT,Down,focusmon,down
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Up,tagmon,up
bind=SUPER+ALT,Down,tagmon,down

# ── Gaps ────────────────────────────────────────────────────────
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ── Mouse Bindings ──────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
mousebind=NONE,btn_middle,togglemaximizescreen,0

# ── Axis Bindings (Trackpad scroll) ─────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Gestures (Trackpad swipe) ───────────────────────────────────
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# ── Brightness and Volume (Media Keys) ─────────────────────────
bind=none,XF86AudioRaiseVolume,spawn,~/.local/bin/volume.sh up
bind=none,XF86AudioLowerVolume,spawn,~/.local/bin/volume.sh down
bind=none,XF86AudioMute,spawn,~/.local/bin/volume.sh mute
bind=none,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind=none,XF86MonBrightnessUp,spawn,~/.local/bin/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.local/bin/brightness.sh down

# ── Media Playback ──────────────────────────────────────────────
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioPause,spawn,playerctl play-pause
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next

# ── Hide/Show Waybar ────────────────────────────────────────────
bind=SUPER,B,spawn,bash ~/.config/mango/scripts/hide_waybar.sh
