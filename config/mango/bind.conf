# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Keybindings                       ║
# ║                    macOS Monochromatic Style                 ║
# ║       Port 1:1 de atajos de Sway (rama pc-note)              ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Mod principal: SUPER (Mod4 / Tecla Windows)

keymode=default

# ── Reload / Salir ──────────────────────────────────────────────
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,spawn,~/.local/bin/power-menu.sh

# ── Selector de Distribución de Teclado ─────────────────────────
bind=SUPER+SHIFT,space,spawn,~/.local/bin/keyboard-layout.sh menu

# ── Cerrar Ventana ──────────────────────────────────────────────
bind=SUPER,q,killclient

# ── Lanzador de Aplicaciones (Wofi / Menús CLI) ─────────────────
bind=SUPER,a,spawn,wofi --show drun
bind=SUPER+SHIFT,a,spawn,~/.local/bin/cli-apps-menu.sh
bind=SUPER+SHIFT,Return,spawn,~/.local/bin/cli-apps-menu.sh

# ── Terminal & Explorador de Archivos ───────────────────────────
bind=SUPER,Return,spawn,foot
bind=SUPER,e,spawn,thunar

# ── Estado de Ventana ───────────────────────────────────────────
bind=SUPER,w,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,g,toggleglobal
bind=SUPER,space,focuslast

# ── Bloquear Pantalla (swaylock) ────────────────────────────────
bindl=SUPER,l,spawn,swaylock -f
bindl=SUPER,Escape,spawn,swaylock -f

# ── Historial de Portapapeles (Cliphist) ─────────────────────────
bind=SUPER,v,spawn_shell,cliphist list | wofi --dmenu --prompt "Clipboard" | cliphist decode | wl-copy

# ── Selector de Emojis (Super + Punto) ──────────────────────────
bind=SUPER,period,spawn,~/.local/bin/emoji-picker.sh

# ── Centro de Control / Quick Settings & Gaming ─────────────────
bind=SUPER,x,spawn,~/.local/bin/quicksettings-menu.sh
bind=CTRL+SUPER,x,spawn,~/.local/bin/quicksettings-menu.sh
bind=SUPER+SHIFT,g,spawn,~/.local/bin/game-launch.sh

# ── Gestor de Monitores ─────────────────────────────────────────
bind=SUPER,p,spawn,~/.local/bin/monitor-manager.sh menu
bind=NONE,XF86Display,spawn,~/.local/bin/monitor-manager.sh menu

# ── Navegación de Foco ──────────────────────────────────────────
# Flechas
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Estilo Vim (h, j, k — Mod+L bloquea pantalla, usar flecha derecha o Tab)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,Tab,focusstack,next

# Vista General de Ventanas (Overview / Mission Control nativo de MangoWM)
bind=ALT,Tab,toggleoverview
bind=SUPER,grave,toggleoverview

# ── Mover Ventanas ──────────────────────────────────────────────
# Flechas
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# Estilo Vim (h, j, k)
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up

# ── Tags (Workspaces 1 a 9, tag 9 para '0') ─────────────────────
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,9,0

# Mover ventana a Tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,9,0

# ── Layouts ─────────────────────────────────────────────────────
# Super+B: Alternar dirección del split en dwindle (equivale a splith/splitv)
bind=SUPER,b,dwindle_toggle_split_direction
# Super+S: Modo Deck / Stacking
bind=SUPER,s,setlayout,deck
# Super+T: Modo Monocle / Tabbed
bind=SUPER,t,setlayout,monocle
# Super+D: Alternar layout (cicla entre dwindle, tile, scroller)
bind=SUPER,d,switch_layout

# ── Scratchpad ──────────────────────────────────────────────────
bind=SUPER+SHIFT,minus,toggle_scratchpad
bind=SUPER,minus,toggle_scratchpad

# ── Modo Redimensión (Submap / Keymode "resize") ─────────────────
bind=SUPER,r,setkeymode,resize

keymode=resize
bind=NONE,h,resizewin,-10,0
bind=NONE,j,resizewin,0,+10
bind=NONE,k,resizewin,0,-10
bind=NONE,l,resizewin,+10,0
bind=NONE,Left,resizewin,-10,0
bind=NONE,Down,resizewin,0,+10
bind=NONE,Up,resizewin,0,-10
bind=NONE,Right,resizewin,+10,0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default

keymode=default

# ── Capturas de Pantalla & Grabación ────────────────────────────
# Pantalla completa
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send "📸 Screenshot" "Pantalla completa guardada"
# Seleccionar área → guardar + copiar
bind=SUPER,Print,spawn_shell,grim -g "$(slurp -d -b 1c1c1eaa -c ffffffff -s ffffff20 -w 1)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy && notify-send "📸 Screenshot" "Selección guardada y copiada"
# Seleccionar área → solo copiar
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp -d -b 1c1c1eaa -c ffffffff -s ffffff20 -w 1)" - | wl-copy && notify-send "📸 Screenshot" "Selección copiada al portapapeles"
# Seleccionar área → solo guardar
bind=CTRL+SUPER,s,spawn_shell,grim -g "$(slurp -d -b 1c1c1eaa -c ffffffff -s ffffff20 -w 1)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send "📸 Screenshot" "Área guardada en Screenshots"
# Menú interactivo de captura
bind=SUPER+SHIFT,Print,spawn,~/.local/bin/screenshot.sh
# Captura de ventana activa directa
bind=ALT,Print,spawn,~/.local/bin/screenshot.sh window
# Grabación de pantalla (Video MP4 / GIF)
bind=SUPER+ALT,r,spawn,~/.local/bin/screen-recorder.sh area
bind=SUPER+ALT+SHIFT,r,spawn,~/.local/bin/screen-recorder.sh area --audio
# Selector de color (Color picker)
bind=SUPER+SHIFT,p,spawn,~/.local/bin/color-picker.sh

# ── Multimedia / Audio / Brillo / OSD (Locked enabled) ──────────
bindl=NONE,XF86AudioMute,spawn_shell,swayosd-client --output-volume mute-toggle || ~/.local/bin/volume.sh mute
bindl=NONE,XF86AudioLowerVolume,spawn_shell,swayosd-client --output-volume lower || ~/.local/bin/volume.sh down
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,swayosd-client --output-volume raise || ~/.local/bin/volume.sh up
bindl=NONE,XF86AudioMicMute,spawn_shell,swayosd-client --input-volume mute-toggle || pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn_shell,swayosd-client --brightness raise || ~/.local/bin/brightness.sh up
bindl=NONE,XF86MonBrightnessDown,spawn_shell,swayosd-client --brightness lower || ~/.local/bin/brightness.sh down

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next

# ── Mouse Bindings ──────────────────────────────────────────────
# Drag / Resize de ventanas con mouse (equivalente a floating_modifier $mod normal)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
