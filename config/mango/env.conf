# ╔══════════════════════════════════════════════════════════════╗
# ║                    MangoWM Environment Variables            ║
# ╚══════════════════════════════════════════════════════════════╝

env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=XDG_CURRENT_DESKTOP,mango:wlroots
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=GDK_BACKEND,wayland,x11,*
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1
env=CLUTTER_BACKEND,wayland
env=SDL_VIDEODRIVER,wayland
env=_JAVA_AWT_WM_NONREPARENTING,1

# Aceleración GPU & Gaming Optimizations (AMD Radeon Vega / Mesa RADV)
env=LIBVA_DRIVER_NAME,radeonsi
env=VDPAU_DRIVER,radeonsi
env=MESA_LOADER_DRIVER_OVERRIDE,radeonsi
env=AMD_VULKAN_ICD,RADV
env=RADV_PERFTEST,aco
env=mesa_glthread,true
env=SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS,0
