# ╔══════════════════════════════════════════════════════════════╗
# ║        Configuración MPV — Aceleración por Hardware GPU      ║
# ╚══════════════════════════════════════════════════════════════╝

# Aceleración por Hardware (VA-API / Mesa AMD)
hwdec=auto-safe
vo=gpu
gpu-context=wayland

# Calidad y rendimiento optimizado
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
video-sync=display-resample
interpolation=yes
tscale=oversample

# Audio y subtítulos
volume=100
volume-max=150
sub-auto=fuzzy
sub-font="Inter"
sub-font-size=40

# Ventana y comportamiento
keep-open=yes
autofit-larger=80%x80%
cursor-autohide=1000
