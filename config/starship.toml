# ╔══════════════════════════════════════════════════════════════╗
# ║           Configuración Minimalista de Starship              ║
# ║           Estilo macOS Monocromático & Limpio                ║
# ╚══════════════════════════════════════════════════════════════╝

add_newline = false
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold white"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "󰘬 "
style = "bold dimmed white"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold dimmed red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
style = "dimmed yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold red)"
