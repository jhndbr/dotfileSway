# Configuración de gtklock (lockscreen GTK4 para Wayland)
# Formato glib key file (secciones [grupo] con nombre=valor).
# El estilado visual (colores, fuentes, bordes) se hace con CSS en
# ~/.config/gtklock/style.css (opcional, no incluido acá).

[main]
# Imagen de fondo del lockscreen
image=/home/jhon/Pictures/1.jpg

# No mostrar el indicador de bloqueo de mayúsculas
# (gtklock maneja el feedback visual por defecto)

# Tamaño de fuente del reloj
fontsize=16

# Color de fondo de respaldo (cuando no hay imagen o falla la carga)
# Formato: #RRGGBB
# bgcolor=#12140e
