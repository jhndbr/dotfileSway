#################################################################
###                   MangoHud Configuration                  ###
###          Minimalist, Modern & Hardware Monitoring         ###
#################################################################

### General Layout & Rendering ###
legacy_layout=false
horizontal=false
round_corners=10
background_alpha=0.5
background_color=12140E
font_size=20
font_scale=1.0
position=top-left
offset_x=16
offset_y=16

### Visual Styling & Colors (Matugen Harmony) ###
text_color=E2E3D8
gpu_color=B5D086
cpu_color=C1CAAB
vram_color=A0D0C9
ram_color=C1CAAB
engine_color=FFB4AB
io_color=A0D0C9
frametime_color=B5D086

### Performance & Metrics ###
fps
fps_limit=0
show_fps_limit
frametime=1
frame_timing=1

### Hardware: GPU (AMD Radeon Vega) ###
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
vram

### Hardware: CPU (AMD Ryzen) ###
cpu_stats
cpu_temp
cpu_mhz
cpu_power
ram

### System & Architecture ###
arch
engine_version
vulkan_driver
wine

### Keybindings ###
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4
