[config]

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/dank-colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/dank-colors.css'

[templates.zed]
input_path = '~/.config/matugen/templates/dank-zed.json'
output_path = '~/.config/zed/themes/dank-zed-theme.json'

[templates.vscode]
input_path = '~/.config/matugen/templates/vscode-color-theme-dark.json'
output_path = '~/.vscode/extensions/danklinux.dms-theme-0.0.3/themes/dankshell-dark.json'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kdeglobals]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/kdeglobals'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/dank-theme.conf'

[templates.foot]
input_path = '~/.config/matugen/templates/foot.ini'
output_path = '~/.config/foot/dank-colors.ini'

[templates.mango]
input_path = '~/.config/matugen/templates/mango-colors.conf'
output_path = '~/.config/mango/dank-colors'

[templates.dunst]
input_path = '~/.config/matugen/templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'

[templates.wofi]
input_path = '~/.config/matugen/templates/wofi-style.css'
output_path = '~/.config/wofi/style.css'

