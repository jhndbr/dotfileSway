[config]

[templates.gtk3]
input_path = '~/Documentos/Github/dotfileSway/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/dank-colors.css'

[templates.gtk4]
input_path = '~/Documentos/Github/dotfileSway/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/dank-colors.css'

[templates.zed]
input_path = '~/Documentos/Github/dotfileSway/templates/dank-zed.json'
output_path = '~/.config/zed/themes/dank-zed-theme.json'

[templates.vscode]
input_path = '~/Documentos/Github/dotfileSway/templates/vscode-color-theme-dark.json'
output_path = '~/.vscode/extensions/danklinux.dms-theme-0.0.3/themes/dankshell-dark.json'

[templates.qt5ct]
input_path = '~/Documentos/Github/dotfileSway/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/Documentos/Github/dotfileSway/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kdeglobals]
input_path = '~/Documentos/Github/dotfileSway/templates/qtct-colors.conf'
output_path = '~/.config/kdeglobals'

[templates.kitty]
input_path = '~/Documentos/Github/dotfileSway/templates/kitty.conf'
output_path = '~/.config/kitty/dank-theme.conf'

[templates.foot]
input_path = '~/Documentos/Github/dotfileSway/templates/foot.ini'
output_path = '~/.config/foot/dank-colors.ini'

[templates.swaylock]
input_path = '~/Documentos/Github/dotfileSway/templates/swaylock.conf'
output_path = '~/.config/swaylock/config'

[templates.sway]
input_path = '~/Documentos/Github/dotfileSway/templates/sway-colors'
output_path = '~/.config/sway/dank-colors'

[templates.dunst]
input_path = '~/Documentos/Github/dotfileSway/templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'
