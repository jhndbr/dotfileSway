# ╔══════════════════════════════════════════════════════════════╗
# ║        Foot Terminal — Monochromatic & Pastel Text          ║
# ╚══════════════════════════════════════════════════════════════╝

[main]
font=JetBrainsMono Nerd Font:size=10.5
pad=14x14 center
initial-window-size-chars=120x35
selection-target=both

[bell]
urgent=yes
notify=yes

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
beam-thickness=2

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+equal
spawn-terminal=Control+Shift+n

[colors-dark]
alpha=0.92
background=121214
foreground=f2f2f7

# Pastel colors strictly for text / syntax elements
regular0=2c2c2e   # black (dark gray)
regular1=ff6b6b   # pastel red
regular2=a6e3a1   # pastel green
regular3=f9e2af   # pastel yellow
regular4=89b4fa   # pastel blue
regular5=cba6f7   # pastel magenta
regular6=94e2d5   # pastel cyan
regular7=e5e5ea   # white

bright0=3a3a3c    # bright black
bright1=ff8787    # bright red
bright2=bbf2b5    # bright green
bright3=faeab1    # bright yellow
bright4=a3c7ff    # bright blue
bright5=dcbbf8    # bright magenta
bright6=abede3    # bright cyan
bright7=ffffff    # bright white

[csd]
preferred=none
