# ╔══════════════════════════════════════════════════════════════╗
# ║             Yazi Configuration — Intuitive & Robust          ║
# ║           Dotfiles Sway — Minimal & Hyperfast               ║
# ╚══════════════════════════════════════════════════════════════╝

[mgr]
ratio          = [ 1, 2, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_scrolloff = 3
title_format   = "Yazi: {cwd}"

[opener]
# 1. Editor de Código y Texto (Zed GUI / Nano CLI)
edit = [
    { run = 'zeditor %s', desc = "Zed Editor (GUI)", orphan = true },
    { run = 'nano %s', desc = "Nano Editor (CLI)", block = true },
]

# 2. Reproductor Multimedia (MPV)
play = [
    { run = 'mpv --force-window %s', desc = "MPV Media Player", orphan = true },
]

# 3. Visor de Imágenes (imv)
open_image = [
    { run = 'imv %s', desc = "imv Image Viewer", orphan = true },
]

# 4. Visor de PDF (Zathura)
open_pdf = [
    { run = 'zathura %s', desc = "Zathura PDF Reader", orphan = true },
]

# 5. Navegador Web (Firefox)
open_web = [
    { run = 'firefox %s', desc = "Firefox Browser", orphan = true },
]

# 6. Descompresión de Archivos (ouch)
open_archive = [
    { run = 'ouch decompress %s', desc = "Extraer con ouch", block = true },
]

# 7. Abridor Genérico del Sistema (XDG-Open)
open_generic = [
    { run = 'xdg-open %s1', desc = "Abrir con aplicación predeterminada (xdg-open)", orphan = true },
]

# 8. Selector Universal de Aplicaciones (Wofi dmenu)
open_with_menu = [
    { run = '~/.local/bin/yazi-open-with.sh %s1', desc = "⚡ Abrir con... (Selector Wofi)", orphan = true },
]

[open]
prepend_rules = [
    # Archivos conocidos con Apps Predeterminadas directas
    { mime = "text/*", use = [ "edit", "open_generic", "open_with_menu" ] },
    { mime = "image/*", use = [ "open_image", "edit", "open_generic", "open_with_menu" ] },
    { mime = "{video,audio}/*", use = [ "play", "open_generic", "open_with_menu" ] },
    { mime = "application/pdf", use = [ "open_pdf", "open_generic", "open_with_menu" ] },
    { mime = "{text/html,application/xhtml+xml}", use = [ "open_web", "edit", "open_generic", "open_with_menu" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,bzip2,compressed,zstd,zst,lz4,lzma,x-tar,x-bzip*,x-7z-compressed,x-rar,vnd.rar}", use = [ "open_archive", "open_generic", "open_with_menu" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 2
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
previewers = [
    { mime = "inode/directory", run = "folder", sync = true },
    { url = "*/", run = "folder", sync = true },
    { mime = "text/*", run = "code" },
    { mime = "application/json", run = "json" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "application/archive", run = "archive" },
]
