# ╔══════════════════════════════════════════════════════════════╗
# ║             Yazi Configuration — Intuitive & Robust          ║
# ║           Dotfiles Sway — Minimal & Hyperfast               ║
# ╚══════════════════════════════════════════════════════════════╝

[manager]
ratio          = [ 1, 2, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_scrolloff = 3
title_format   = "Yazi: {cwd}"

[opener]
# 1. Editor de Código y Texto (Zed GUI / Nano CLI)
edit = [
    { run = 'zeditor "$@"', desc = "Zed Editor (GUI)", orphan = true },
    { run = 'nano "$@"', desc = "Nano Editor (CLI)", block = true },
]

# 2. Reproductor Multimedia (MPV)
play = [
    { run = 'mpv --force-window "$@"', desc = "MPV Media Player", orphan = true },
]

# 3. Visor de Imágenes (imv)
open_image = [
    { run = 'imv "$@"', desc = "imv Image Viewer", orphan = true },
]

# 4. Visor de PDF (Zathura)
open_pdf = [
    { run = 'zathura "$@"', desc = "Zathura PDF Reader", orphan = true },
]

# 5. Navegador Web (Firefox)
open_web = [
    { run = 'firefox "$@"', desc = "Firefox Browser", orphan = true },
]

# 6. Descompresión de Archivos (ouch)
open_archive = [
    { run = 'ouch decompress "$@"', desc = "Extraer con ouch", block = true },
]

# 7. Abrir carpeta externamente (Zed / Nueva terminal Yazi)
open_folder = [
    { run = 'zeditor "$1"', desc = "Abrir carpeta en Zed", orphan = true },
    { run = 'foot --title="yazi" -e yazi "$1"', desc = "Abrir carpeta en nueva terminal", orphan = true },
]

# 8. Selector Universal de Aplicaciones (Wofi dmenu)
open_with_menu = [
    { run = '~/.local/bin/yazi-open-with.sh "$@"', desc = "⚡ Abrir con... (Selector Wofi)", orphan = true }
]

[open]
rules = [
    # Directorios: Enter navega por defecto. Si se consulta abridores (r/R), permite abrir en Zed/Terminal.
    { mime = "inode/directory", use = [ "open_folder", "open_with_menu" ] },
    { url = "*/", use = [ "open_folder", "open_with_menu" ] },

    # Archivos conocidos con Apps Predeterminadas directas
    { mime = "text/*", use = [ "edit", "open_with_menu" ] },
    { mime = "image/*", use = [ "open_image", "edit", "open_with_menu" ] },
    { mime = "{video,audio}/*", use = [ "play", "open_with_menu" ] },
    { mime = "application/pdf", use = [ "open_pdf", "open_with_menu" ] },
    { mime = "{text/html,application/xhtml+xml}", use = [ "open_web", "edit", "open_with_menu" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,bzip2,compressed,zstd,zst,lz4,lzma,x-tar,x-bzip*,x-7z-compressed,x-rar,vnd.rar}", use = [ "open_archive", "open_with_menu" ] },

    # Archivos desconocidos / "random": Se despliega automáticamente el selector "Abrir con..."
    { mime = "*", use = [ "open_with_menu", "edit" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 2
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
previewers = [
    { mime = "inode/directory", run = "folder", sync = true },
    { url = "*/", run = "folder", sync = true },
    { mime = "text/*", run = "code" },
    { mime = "application/json", run = "json" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "application/archive", run = "archive" },
]
