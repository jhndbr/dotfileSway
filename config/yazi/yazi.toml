# ╔══════════════════════════════════════════════════════════════╗
# ║                    Yazi Configuration                       ║
# ║           Dotfiles Sway — Minimal & Hyperfast               ║
# ╚══════════════════════════════════════════════════════════════╝

[manager]
ratio          = [ 1, 2, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_scrolloff = 3
title_format   = "Yazi: {cwd}"

[opener]
edit = [
    { run = 'zed "$@"', desc = "Zed Editor (GUI)", orphan = true },
    { run = '${EDITOR:-nano} "$@"', desc = "Editor CLI (Nano/NVim)", block = true },
    { run = 'xdg-open "$@"', desc = "App Predeterminada (XDG)", orphan = true },
]
play = [
    { run = 'mpv --force-window "$@"', desc = "MPV Media Player", orphan = true },
    { run = 'xdg-open "$@"', desc = "App Predeterminada (XDG)", orphan = true },
]
open_image = [
    { run = 'imv "$@"', desc = "imv Image Viewer", orphan = true },
    { run = 'firefox "$@"', desc = "Firefox Browser", orphan = true },
    { run = 'xdg-open "$@"', desc = "App Predeterminada (XDG)", orphan = true },
]
open_pdf = [
    { run = 'zathura "$@"', desc = "Zathura PDF Reader", orphan = true },
    { run = 'firefox "$@"', desc = "Firefox Browser", orphan = true },
    { run = 'xdg-open "$@"', desc = "App Predeterminada (XDG)", orphan = true },
]
open_web = [
    { run = 'firefox "$@"', desc = "Firefox Web Browser", orphan = true },
    { run = 'xdg-open "$@"', desc = "App Predeterminada (XDG)", orphan = true },
]
open_generic = [
    { run = 'xdg-open "$@"', desc = "Abrir con XDG Default", orphan = true },
    { run = 'zed "$@"', desc = "Zed Editor", orphan = true },
    { run = 'firefox "$@"', desc = "Firefox", orphan = true },
    { run = 'mpv "$@"', desc = "MPV", orphan = true },
    { run = 'imv "$@"', desc = "imv", orphan = true },
    { run = 'zathura "$@"', desc = "Zathura", orphan = true },
]
open_with_menu = [
    { run = '~/.local/bin/yazi-open-with.sh "$@"', desc = "⚡ Selector Universal de App (Wofi)", orphan = true }
]

[open]
rules = [
    { name = "*/", use = [ "open_generic", "open_with_menu" ] },
    { mime = "text/*", use = [ "edit", "open_generic", "open_with_menu" ] },
    { mime = "image/*", use = [ "open_image", "edit", "open_with_menu" ] },
    { mime = "{video,audio}/*", use = [ "play", "open_generic", "open_with_menu" ] },
    { mime = "application/pdf", use = [ "open_pdf", "open_with_menu" ] },
    { mime = "{text/html,application/xhtml+xml}", use = [ "open_web", "edit", "open_with_menu" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,bzip2,compressed}", use = [ "open_generic", "open_with_menu" ] },
    { mime = "*", use = [ "open_generic", "edit", "open_with_menu" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 2
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
previewers = [
    { name = "*/", run = "folder", sync = true },
    { mime = "text/*", run = "code" },
    { mime = "application/json", run = "json" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "application/archive", run = "archive" },
]
