# ╔══════════════════════════════════════════════════════════════╗
# ║                  Yazi Keymap Configuration                  ║
# ║         Versión correcta para Yazi 26.x — [mgr]             ║
# ╚══════════════════════════════════════════════════════════════╝

[mgr]
prepend_keymap = [
    # ── Navegación & Apertura Intuitiva ─────────────────────────
    { on = [ "<Backspace>" ], run = "leave", desc = "Volver al directorio anterior" },
    { on = [ "<Left>" ], run = "leave", desc = "Volver al directorio anterior" },

    # ── Menú "Abrir con..." ────────────────────────────────────
    # 'R': Selector universal de apps del sistema con Wofi
    # Usamos shell con %s que Yazi reemplaza por la ruta del archivo seleccionado
    { on = [ "R" ], run = 'shell --orphan "python3 ~/.local/bin/yazi-open-with.sh %s"', desc = "Abrir con cualquier aplicación (Selector Wofi)" },
    { on = [ "<C-o>" ], run = 'shell --orphan "python3 ~/.local/bin/yazi-open-with.sh %s"', desc = "Abrir con cualquier aplicación (Selector Wofi)" },

    # ── Terminal ───────────────────────────────────────────────
    { on = [ "!" ], run = 'shell --orphan "foot -D \"$PWD\""', desc = "Abrir terminal (Foot) en este directorio" },
    { on = [ "<C-t>" ], run = 'shell --orphan "foot -D \"$PWD\""', desc = "Abrir terminal (Foot) en este directorio" },

    # ── Operaciones de Archivo Rápidas ─────────────────────────
    { on = [ "r" ], run = "rename --cursor=before_ext", desc = "Renombrar (cursor antes de extensión)" },
    { on = [ "e" ], run = "shell 'ouch decompress %s' --confirm", desc = "Extraer archivo(s) con ouch" },
    { on = [ "E" ], run = "shell 'ouch compress %s' --confirm", desc = "Comprimir archivo(s) con ouch" },

    # ── Saltos Rápidos de Carpetas (Go to) ─────────────────────
    { on = [ "g", "h" ], run = "cd ~", desc = "Ir a Home (~)" },
    { on = [ "g", "d" ], run = "cd ~/Descargas", desc = "Ir a Descargas" },
    { on = [ "g", "D" ], run = "cd ~/Downloads", desc = "Ir a Downloads" },
    { on = [ "g", "o" ], run = "cd ~/Documentos", desc = "Ir a Documentos" },
    { on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Ir a Pictures / Imágenes" },
    { on = [ "g", "P" ], run = "cd ~/Imágenes", desc = "Ir a Imágenes" },
    { on = [ "g", "v" ], run = "cd ~/Vídeos", desc = "Ir a Vídeos" },
    { on = [ "g", "V" ], run = "cd ~/Videos", desc = "Ir a Videos" },
    { on = [ "g", "." ], run = "cd ~/Documents/dotfileSway", desc = "Ir a Dotfiles" },
    { on = [ "g", "c" ], run = "cd ~/.config", desc = "Ir a ~/.config" },
    { on = [ "g", "t" ], run = "cd /tmp", desc = "Ir a /tmp" },
]
