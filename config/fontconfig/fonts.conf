<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- ╔══════════════════════════════════════════════════════════════╗ -->
    <!-- ║        Configuración de Renderizado y Fallbacks de Fuentes   ║ -->
    <!-- ╚══════════════════════════════════════════════════════════════╝ -->

    <!-- ── 1. Renderizado de Alta Definición y Suavizado ───────────── -->
    <match target="font">
        <edit mode="assign" name="antialias">
            <bool>true</bool>
        </edit>
        <edit mode="assign" name="hinting">
            <bool>true</bool>
        </edit>
        <edit mode="assign" name="hintstyle">
            <const>hintslight</const>
        </edit>
        <edit mode="assign" name="rgba">
            <const>rgb</const>
        </edit>
        <edit mode="assign" name="lcdfilter">
            <const>lcddefault</const>
        </edit>
    </match>

    <!-- ── 2. Fallbacks de Fuentes Preferidas (Sans-Serif) ──────────── -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Inter</family>
            <family>SF Pro Display</family>
            <family>Noto Sans</family>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- ── 3. Fallbacks de Fuentes Serif ────────────────────────────── -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Serif</family>
            <family>DejaVu Serif</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- ── 4. Fallbacks de Fuentes Monospace (Código / Terminal) ────── -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>JetBrains Mono</family>
            <family>Noto Sans Mono</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
</fontconfig>
